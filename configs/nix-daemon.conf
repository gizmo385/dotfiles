# Linked as ~/.config/nix/nix.conf on multi-user (daemon) nix installs.
#
# Deliberately does NOT set extra-substituters / extra-trusted-public-keys. Those are restricted
# settings: the daemon refuses them from a user-level config unless the caller is a trusted user, so
# naming them here achieves nothing except an "ignoring untrusted substituter" warning on every
# single nix invocation.
#
# install.sh instead copies the cache configuration out of configs/nix.conf and into
# /etc/nix/nix.conf, where the daemon honors it for every user on the machine -- and without anyone
# needing trusted-user rights, which nix documents as "essentially equivalent to giving that user
# root access to the system".
#
# Single-user installs (the docker image) have no daemon to answer to and use configs/nix.conf,
# which keeps the cache settings inline.
experimental-features = nix-command flakes
